name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --info
      continue-on-error: true

    - name: Show Gradle build errors if failed
      if: failure() || true
      run: |
        find app/build/reports -type f || true
        cat app/build/reports/problems/problems-report.html || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WhatsSync-debug
        path: app/build/outputs/apk/debug/*.apk
